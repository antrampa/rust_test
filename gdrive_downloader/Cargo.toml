[package]
name = "gdrive_downloader"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
indicatif = "0.17" # progress bars
chrono = { version = "0.4", features = ["serde"] }

